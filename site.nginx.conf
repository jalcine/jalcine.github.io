server {
  server_name jacky.wtf;
  rewrite ^(.*) http://www.jacky.wtf$1 permanent;
}


# TODO: Add redirect to www.jacky.wtf if coming from apex.

server {
	root /var/www/html;
	index index.html index.htm;
  server_name www.jacky.wtf; # managed by Certbot

	location / {
		try_files $uri $uri/ =404;
	}

  listen [::]:443 ssl ipv6only=on; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/jacky.wtf/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/jacky.wtf/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/html;

	index index.html index.htm;

	server_name _;

	location / {
		try_files $uri $uri/ =404;
	}
}

server {
    if ($host = www.jacky.wtf) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = jacky.wtf) {
        return 301 https://www.$host$request_uri;
    } # managed by Certbot


	listen 80 ;
	listen [::]:80 ;
  server_name www.jacky.wtf jacky.wtf;
  return 404; # managed by Certbot
}

# TODO: Add redirect to www.jacky.wtf if coming from apex.
server {
	root /var/www/html;
	index index.html index.htm;
  server_name www.jacky.wtf; # managed by Certbot

	location / {
		try_files $uri $uri/ =404;
	}

  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  rewrite ^/twitch(.*) https://twitch.tv/jackyalcine permanent;
  rewrite ^/github(.*) https://github.com/jalcine permanent;

  if ($http_user_agent ~* (AdsBot-Google|Amazonbot|anthropic-ai|Applebot|AwarioRssBot|AwarioSmartBot|Bytespider|CCBot|ChatGPT|ChatGPT-User|Claude-Web|ClaudeBot|cohere-ai|DataForSeoBot|Diffbot|FacebookBot|Google-Extended|GPTBot|ImagesiftBot|magpie-crawler|omgili|Omgilibot|peer39_crawler|PerplexityBot|YouBot|bingbot|DotBot)) {
    return 403;
  }

  listen [::]:443 ssl ipv6only=on; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/jacky.wtf/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/jacky.wtf/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  listen 80;
  listen [::]:80;

  server_name www.jacky.wtf jacky.wtf;
  rewrite ^(.*) https://www.jacky.wtf$1 permanent;
}


